name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # Build — syntax-check the single static agent file
  # ═════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax check (node --check)
        run: |
          node --check jscript-agent.js
          echo "syntax OK"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-jscript
          retention-days: 1
          path: jscript-agent.js

  # ═════════════════════════════════════════════════════════════════════════
  # Test — cscript smoke run (H_URL unset ⇒ silent (log ships only), clean 'fail')
  # ═════════════════════════════════════════════════════════════════════════
  test-windows-cscript:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-jscript
          path: .
      - name: Test agent (cscript, H_URL unset)
        shell: pwsh
        run: |
          Copy-Item jscript-agent.js master.js
          Add-Content -Path master.js -Value 'WScript.Echo("result: " + runAgent());'
          $output = (cscript //nologo master.js 2>&1 | Out-String)
          Write-Host $output
          if ($output -match "beacon endpoint not set") { Write-Host "FAILED: unexpected local echo of 'beacon endpoint not set'"; exit 1 }
          if (-not ($output -match "result: fail")) { Write-Host "FAILED: expected 'result: fail'"; exit 1 }

  # ═════════════════════════════════════════════════════════════════════════
  # Release — republish the rolling 'jscript-agent-debug' release from main
  # ═════════════════════════════════════════════════════════════════════════
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - test-windows-cscript
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax check (node --check)
        run: |
          node --check jscript-agent.js
          echo "syntax OK"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jscript-agent-debug"
          TITLE="jscript-agent-debug"
          BODY="Automated build from \`main\`.

          **Commit:** [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')

          > Rolling release: rebuilt on every push to \`main\`."

          # Delete existing release and tag if they exist
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Republish fresh
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$BODY" \
            --target "$GITHUB_SHA" \
            jscript-agent.js
