name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # Build — syntax-check the single static agent file
  # ═════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax check (node --check)
        run: |
          node --check jscript-agent.js
          echo "syntax OK"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-jscript
          retention-days: 1
          path: jscript-agent.js


  # ═════════════════════════════════════════════════════════════════════════
  # Release — republish the rolling 'jscript-agent-debug' release from main
  # ═════════════════════════════════════════════════════════════════════════
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax check (node --check)
        run: |
          node --check jscript-agent.js
          echo "syntax OK"

      - name: Contract check (what the C2 panel's fetch gates on)
        run: |
          grep -q 'function runAgent(' jscript-agent.js || { echo "FAILED: top-level entry 'function runAgent(' missing"; exit 1; }
          echo "contract OK"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jscript-agent-debug"
          TITLE="jscript-agent-debug"
          BODY="Automated build from \`main\`.

          **Commit:** [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')

          > Rolling release: rebuilt on every push to \`main\`."

          # Delete existing release and tag if they exist
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Republish fresh
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$BODY" \
            --target "$GITHUB_SHA" \
            jscript-agent.js
